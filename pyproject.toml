[project]
name = "detecto"
version = "0.1.0"
description = "Real-time person detection and counting with YOLOv8 and FastAPI."
readme = "README.md"
authors = [
    { name = "rouwel", email = "rouwelngacha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.0.0",
    "ultralytics>=8.4.191",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]

# The application is a service, not an installable library.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
